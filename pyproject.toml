[project]
name = "tomi-ai-hermes"
version = "0.1.0"
description = "Evidence-linked Britannica and Wikipedia comparisons through Hermes and Tomi AI core"
readme = "README.md"
authors = [{ name = "winsortf", email = "winsortf@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.119,<1",
  "uvicorn>=0.38,<1",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "lancedb>=0.25,<1",
  "pyarrow>=22,<30",
  "pillow>=12,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
tomi-ai-hermes = "tomi_ai_hermes.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
